; ON6DP - M5Stack Core Basic / Gray / Fire (ESP32, the model with 3 buttons)
;         + Module13.2 LoRa-1262 (SX1262, M5IOE1 I/O expander)
;         + Module13.2 LAN (W5500)
;
; Everything shares the Core's SPI bus (SCK=18, MISO=19, MOSI=23).
; See variants/m5stack_core/README-ON6DP-M5CORE.md for the DIP switch / jumper positions.

[M5Stack_Core]
extends = esp32_base
board = m5stack-core-esp32
board_build.partitions = min_spiffs.csv   ; 1.9 MB per app slot, works on 4 MB and 16 MB Cores
build_flags =
  ${esp32_base.build_flags}
  -I variants/m5stack_core
  -D M5STACK_CORE
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
; --- Module13.2 LoRa-1262: must match the module's DIP switches (SW1 / SW3) ---
  -D P_LORA_NSS=5          ; M5-Bus pin 20
  -D P_LORA_BUSY=36        ; M5-Bus pin 4
  -D P_LORA_DIO_1=35       ; M5-Bus pin 2 (IRQ)
  -D P_LORA_RESET=-1       ; reset goes through the M5IOE1 expander
  -D LORA_IOE_ADDR=0x74    ; SW2: A=0, B=0
; --- Module13.2 LAN: must match the module's jumper caps ---
  -D P_ETH_CS=15           ; M5-Bus pin 23
  -D P_ETH_RST=13          ; M5-Bus pin 22
  -D P_ETH_INT=34          ; M5-Bus pin 26
; --- I2C (expander) ---
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
; --- SX1262 settings, same as M5Stack's own RadioLib example ---
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0
  -D SX126X_USE_REGULATOR_LDO=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D LORA_CR=8             ; coding rate 4/8 (default for a freshly flashed node)
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/m5stack_core>
lib_deps =
  ${esp32_base.lib_deps}

; Repeater + colour screen + 3 buttons + MQTT observer gateway over Ethernet
[env:M5Stack_Core_repeater_lan_mqtt]
extends = M5Stack_Core
build_flags =
  ${M5Stack_Core.build_flags}
  -D DISPLAY_CLASS=M5CoreDisplay
  -D M5CORE_UI
  -D ADVERT_NAME='"ON6DP M5 Repeater"'
  -D ADVERT_LAT=50.541508
  -D ADVERT_LON=5.523446
  -D ADMIN_PASSWORD='"Your Password"'
  -D MAX_NEIGHBOURS=50
  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
; --- wired network ---
  -D WITH_M5_LAN
;  -D ETH_STATIC_IP='"192.168.1.50"'    ; default is DHCP
;  -D ETH_GATEWAY='"192.168.1.1"'
;  -D ETH_DNS='"192.168.1.1"'
;  -D ETH_SUBNET='"255.255.255.0"'
; --- MQTT observer gateway (same message format as the Heltec V4 firmware) ---
  -D WITH_MQTT_BRIDGE
  -D MQTT_NET_EXTERNAL
  -D MQTT_SERVER='"mqtt.no-ip.org"'
  -D MQTT_PORT=1883
  -D MQTT_TOPIC='"meshcore/BE/m5core_repeater/packets"'
  -D MQTT_CLIENT_ID='"m5core_repeater"'
  -D MQTT_CLIENT_VERSION='"on6dp-m5core-lan"'
  -D MQTT_FIRMWARE_LABEL='"ON6DP-Custom Firmware 1.17.3"'
build_src_filter = ${M5Stack_Core.build_src_filter}
  +<helpers/bridges/MqttBridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${M5Stack_Core.lib_deps}
  ${esp32_ota.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
  knolleary/PubSubClient @ ^2.8
  https://github.com/m5stack/M5-Ethernet.git

; Same hardware without the LAN module: plain repeater with screen and buttons
[env:M5Stack_Core_repeater]
extends = M5Stack_Core
build_flags =
  ${M5Stack_Core.build_flags}
  -D DISPLAY_CLASS=M5CoreDisplay
  -D M5CORE_UI
  -D ADVERT_NAME='"ON6DP M5 Repeater"'
  -D ADVERT_LAT=50.541508
  -D ADVERT_LON=5.523446
  -D ADMIN_PASSWORD='"Your Password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${M5Stack_Core.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${M5Stack_Core.lib_deps}
  ${esp32_ota.lib_deps}
  lovyan03/LovyanGFX @ ^1.2.7
